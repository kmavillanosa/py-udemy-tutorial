site_name: Kim Learns Python
site_description: Python fundamentals tutorial and learning notes
site_author: Kim Avillanosa

# GitHub Pages configuration
site_url: https://kmavillanosa.github.io/py-udemy-tutorial/
repo_url: https://github.com/kmavillanosa/py-udemy-tutorial
repo_name: py-udemy-tutorial

theme:
  name: material
  favicon: img/favicon.svg
  logo: img/favicon.svg
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Section One:
    - Overview: section-one/README.md
    - Introduction: section-one/1introduction.md
    - Variables and Constants: section-one/2variables-and-constants.md
    - Classes and Objects: section-one/3python-class-and-objects.md
    - Arrays: section-one/4python-array-implementation.md

plugins:
  - search

extra_javascript:
  - https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js
  - js/pyodide-runner.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

